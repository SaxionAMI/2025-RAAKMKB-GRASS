# Football stadium crowd sentiment. All keys:
# https://saxionami.github.io/2026-AMI-AudioOpsFramework/reference/task-config/
task_type: classification
archetype: trainable_model        # train, evaluate, batch_infer and serve

input_dir: audio_input/sentiment/CrowdAudioDataport   # <label>/*.wav underneath
output_dir: storage/sentiment

class_labels: [approval, disapproval, neutral]

feature_type: spectrogram
segment_duration: 1.0             # seconds per segment, also the live window
input_shape: [1, 128, 32]         # spectrogram of a 1 s segment at 16 kHz

# Keep all segments of one recording in the same split.
split_strategy: group
# If one match recording is cut into several files (match3_001.wav,
# match3_002.wav, ...), uncomment this so the whole match stays in one split:
# group_pattern: '^(.+)_\d+$'

batch_size: 32
epochs: 10
learning_rate: 0.001
# class_weights: [1.0, 1.0, 1.0]  # approval, disapproval, neutral

# Set to true (with STORAGE_BACKEND=minio and MINIO_*) to copy features,
# datasets, checkpoints and results to object storage after each step.
use_remote_storage: false
