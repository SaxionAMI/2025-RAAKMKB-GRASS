# tasks/sentiment/config.yaml — football stadium crowd sentiment.
task_name: sentiment
task_type: classification

# Full arc: train + evaluate + batch_infer + serve.
archetype: trainable_model

feature_type: spectrogram
input_dir: "audio_input/sentiment/CrowdAudioDataport"   # <label>/*.wav underneath
output_dir: "storage/sentiment"
split_strategy: "group"          # keeps segments of one recording out of train/test

num_classes: 3
class_labels:
  - "approval"
  - "disapproval"
  - "neutral"

model_architecture: resnet18     # metadata; the task builds resnet18 in build_model
input_shape: [1, 128, 87]
batch_size: 32
epochs: 10
learning_rate: 0.001

# Local-first. Set true (and configure MINIO_* / STORAGE_BACKEND=minio) to sync
# features/datasets/checkpoints/results to object storage after each step.
use_remote_storage: false
# storage_bucket_prefix: "sentiment_v2"
