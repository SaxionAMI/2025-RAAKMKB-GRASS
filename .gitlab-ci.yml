# .gitlab-ci.yml

stages:
  - test
  - build
  - run
  - deploy

variables:
  DAGSTER_HOME: "/app/dagster_home"
  IMAGE_TAG: "latest"

  # Docker Hub credentials (❗ replace with CI/CD variables in production)
  DOCKER_USERNAME: "feyalt"
  DOCKER_PASSWORD: "dckr_pat_DgD3EwYpSBbuhXDO5NJN23EBAzc"

  # Docker image names
  DAGSTER_IMAGE: "feyalt/grass-pipeline:dagster"
  API_IMAGE: "feyalt/grass-pipeline:api"

# -------------------------------
# ✅ UNIT TESTS
# -------------------------------
test:
  stage: test
  image: python:3.10
  script:
    - export PYTHONPATH="$CI_PROJECT_DIR"
    - python -m pip install --upgrade pip
    - python -m pip install pytest pytest-mock -r requirements.txt
    - python -m pytest tests/
# -------------------------------
# 🛠️ BUILD & PUSH DOCKER IMAGES
# -------------------------------
build:
  stage: build
  image: docker:24.0.2
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""  # Required for DinD
    DOCKER_DRIVER: overlay2
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker build -t $DAGSTER_IMAGE:$IMAGE_TAG -f grass_pipeline_dagster/Dockerfile.dagster .
    - docker build -t $API_IMAGE:$IMAGE_TAG -f api/Dockerfile.api .
    - docker push $DAGSTER_IMAGE:$IMAGE_TAG
    - docker push $API_IMAGE:$IMAGE_TAG

# -------------------------------
# 🔁 COMPOSE STACK TESTING
# -------------------------------
run:
  stage: run
  image: docker:24.0.2
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - docker-compose -f docker-compose.yml up -d
    - sleep 30
    - docker-compose ps
    - docker-compose logs api
    - docker-compose down

# -------------------------------
# 🚀 OPTIONAL MANUAL DEPLOYMENT
# -------------------------------
deploy:
  stage: deploy
  image: docker:24.0.2
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  when: manual
  script:
    - echo "Deploying full stack..."
    - docker-compose -f docker-compose.yml up -d
    - docker-compose ps
    - echo "Deployment complete."
