image: docker:24.0.2

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DAGSTER_HOME: "/app/dagster_home"

  # Docker Hub Access Token (use GitLab CI/CD variables in production)
  DOCKER_USERNAME: "feyalt"
  DOCKER_PASSWORD: "dckr_pat_DgD3EwYpSBbuhXDO5NJN23EBAzc"

  # Docker Images
  DAGSTER_IMAGE: "feyalt/grass-pipeline:dagster"
  API_IMAGE: "feyalt/grass-pipeline:api"
  IMAGE_TAG: "latest"

before_script:
  - apk add --no-cache python3 py3-pip
  - pip install --upgrade pip
  - pip install pytest docker-compose

stages:
  - test
  - build
  - run
  - deploy

# -------------------------------
# UNIT TESTS
# -------------------------------
unit_tests:
  stage: test
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - pytest tests/

# -------------------------------
# BUILD & PUSH DOCKER IMAGES
# -------------------------------
build_images:
  stage: build
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker build -t $DAGSTER_IMAGE:$IMAGE_TAG -f grass_pipeline_dagster/Dockerfile.dagster .
    - docker build -t $API_IMAGE:$IMAGE_TAG -f api/Dockerfile.api .
    - docker push $DAGSTER_IMAGE:$IMAGE_TAG
    - docker push $API_IMAGE:$IMAGE_TAG

# -------------------------------
# COMPOSE STACK TESTING
# -------------------------------
run_stack_and_test_job:
  stage: run
  script:
    - docker-compose -f docker-compose.yml up -d
    - sleep 30
    - docker-compose ps
    - docker-compose logs api
    - docker-compose down

# -------------------------------
# OPTIONAL LIVE DEPLOYMENT
# -------------------------------
deploy:
  stage: deploy
  when: manual
  script:
    - echo "Deploying full stack..."
    - docker-compose -f docker-compose.yml up -d
    - docker-compose ps
    - echo "Deployment complete."
