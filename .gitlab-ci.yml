stages:
  - test
  - build
  - deploy

variables:
  DAGSTER_HOME: "/app/dagster_home"
  PYTHON_VERSION: "3.10"
  DOCKER_REPO: "feyalt/grass-pipeline"

test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - mkdir -p test-reports
    - python -m pytest tests/ --maxfail=1 --disable-warnings -q --junitxml=test-reports/pytest.xml
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

build:
  stage: build
  image: alpine:3.18
  script:
    - echo "API_TAG=api" > deploy.env
    - echo "DAGSTER_TAG=dagster" >> deploy.env
    - cat deploy.env
  artifacts:
    paths:
      - deploy.env
    expire_in: 1 day

deploy:
  stage: deploy
  image: docker:24.0.2
  services:
    - docker:dind
  when: manual
  script:
    - echo "pulling images..."
    - docker pull ${DOCKER_REPO}:api
    - docker pull ${DOCKER_REPO}:dagster
    - echo "starting stack..."
    - docker-compose -f docker-compose.yml pull
    - docker-compose -f docker-compose.yml up -d
    - docker-compose -f docker-compose.yml ps
    - echo "healthcheck (api):"
    - sleep 6
    - docker-compose -f docker-compose.yml exec -T api sh -c "curl -fsS http://localhost:8000/health || exit 1"