stages:
  - test
  - build
  - deploy

variables:
  DAGSTER_HOME: "/app/dagster_home"
  PYTHON_VERSION: "3.10"
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: docker.io/feyalt/grass-pipeline

# -------------------------------
# UNIT TESTS (Lightweight & Fast)
# -------------------------------
test:
  stage: test
  image: python:$PYTHON_VERSION
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - python -m pytest tests/ --maxfail=1 --disable-warnings -q
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

# -------------------------------
# BUILD & PUSH IMAGES (Dagster + API only)
# -------------------------------
build-images:
  stage: build
  image: docker:24.0.2
  services:
    - docker:dind
  script:
    # Hardcoded Docker Hub login (use CI/CD variables later for safety)
    - echo "dckr_pat_IJhYxUAPyNk1eusOAiTIDtLK8xk" | docker login -u "feyalt" --password-stdin

    # Build Dagster (no stray backslashes)
    - docker build -f grass_pipeline_dagster/Dockerfile.dagster -t $REGISTRY:dagster .

    # Build API
    - docker build -f api/Dockerfile.api -t $REGISTRY:api .

    # Push both
    - docker push $REGISTRY:dagster
    - docker push $REGISTRY:api

# -------------------------------
# OPTIONAL MANUAL DEPLOYMENT
# -------------------------------
deploy:
  stage: deploy
  image: docker:24.0.2
  services:
    - docker:dind
  when: manual
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo "Deploying local stack (pulling latest images)..."
    - docker-compose pull
    - docker-compose -f docker-compose.yml up -d
    - docker-compose ps
    - echo "Deployment complete."
