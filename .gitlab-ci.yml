stages:
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.10"
  DOCKER_REPO_BASE: "feyalt/grass_final"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # version tag: YYYYMMDDHHMM-<shortsha>
  VER: "${CI_COMMIT_TIMESTAMP:0:12}-${CI_COMMIT_SHORT_SHA}"

# 1) TEST - run unit tests
test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - mkdir -p test-reports
    - python -m pytest tests/ --maxfail=1 --disable-warnings -q --junitxml=test-reports/pytest.xml
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

# 2) BUILD
build:
  stage: build
  image: docker:26
  services:
    - name: docker:26-dind
      command: ["--insecure-registry=0.0.0.0/0", "--tls=false"]
  variables:
    DOCKER_BUILDKIT: "1"
  needs: ["test"]
  when: manual
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Building API image ${DOCKER_REPO_BASE}:api-${VER} and :api-latest"
    - >
      docker build
      -f api/Dockerfile.api
      -t ${DOCKER_REPO_BASE}:api-${VER}
      -t ${DOCKER_REPO_BASE}:api-latest
      .
    - docker push ${DOCKER_REPO_BASE}:api-${VER}
    - docker push ${DOCKER_REPO_BASE}:api-latest

    - echo "Building Dagster image ${DOCKER_REPO_BASE}:dagster-${VER} and :dagster-latest"
    - >
      docker build
      -f grass_pipeline_dagster/Dockerfile.dagster
      -t ${DOCKER_REPO_BASE}:dagster-${VER}
      -t ${DOCKER_REPO_BASE}:dagster-latest
      .
    - docker push ${DOCKER_REPO_BASE}:dagster-${VER}
    - docker push ${DOCKER_REPO_BASE}:dagster-latest

# 3) DEPLOY 
deploy:
  stage: deploy
  image: docker:26
  services:
    - name: docker:26-dind
      command: ["--insecure-registry=0.0.0.0/0", "--tls=false"]
  variables:
    DEPLOY_COMPOSE_PATH: "docker-compose.yml"
  needs:
    - job: build
      optional: true
  when: manual
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Pulling updated images and restarting stack…"
    - docker compose -f ${DEPLOY_COMPOSE_PATH} pull
    - docker compose -f ${DEPLOY_COMPOSE_PATH} up -d
