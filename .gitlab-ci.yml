stages:
  - test
  - run
  - deploy

variables:
  DAGSTER_HOME: "/app/dagster_home"
  PYTHON_VERSION: "3.10"

# -------------------------------
# UNIT TESTS (Lightweight & Fast)
# -------------------------------
test:
  stage: test
  image: python:$PYTHON_VERSION
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - python -m pytest tests/
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

# -------------------------------
# STACK TEST (Optional Manual Local Stack Boot)
# -------------------------------
run:
  stage: run
  image: docker:24.0.2
  services:
    - docker:dind
  when: manual
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - docker-compose -f docker-compose.yml up -d
    - sleep 20
    - docker-compose ps
    - docker-compose logs dagster || true
    - docker-compose down

# -------------------------------
# OPTIONAL MANUAL DEPLOYMENT (FROM EXISTING DOCKERFILES)
# -------------------------------
deploy:
  stage: deploy
  image: docker:24.0.2
  services:
    - docker:dind
  when: manual
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo "Deploying local stack (no rebuild)..."
    - docker-compose -f docker-compose.yml up -d
    - docker-compose ps
    - echo "Deployment complete."
