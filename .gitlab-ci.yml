stages:
  - test
  - deploy

variables:
  DAGSTER_HOME: "/app/dagster_home"
  PYTHON_VERSION: "3.10"

# -------------------------------
# UNIT TESTS (Lightweight & Fast)
# -------------------------------
test:
  stage: test
  image: python:$PYTHON_VERSION
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - mkdir -p test-reports
    - python -m pytest tests/ --maxfail=1 --disable-warnings -q --junitxml=test-reports/pytest.xml
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

# -------------------------------
# DEPLOY (manual) — Pull prebuilt images & start stack
# -------------------------------
deploy:
  stage: deploy
  image: docker:24.0.2
  services:
    - docker:dind
  when: manual
  before_script:
    # If your registry is private, set DOCKER_HUB_USERNAME/DOCKER_HUB_PASSWORD as GitLab CI variables
    - '[ -n "$DOCKER_HUB_USERNAME" ] && echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin || true'
  script:
    # Verify / pull the images you already have on Docker Hub
    - docker pull feyalt/grass-pipeline:api
    - docker pull feyalt/grass-pipeline:dagster

    # Pull any other images referenced in docker-compose and bring the stack up
    - docker-compose pull
    - docker-compose -f docker-compose.yml up -d
    - docker-compose ps
