stages:
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.10"
  DOCKER_REPO: "feyalt/grass-pipeline"

# -------------------------------
# 1) TEST - run unit tests (fast)
# -------------------------------
test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - mkdir -p test-reports
    - python -m pytest tests/ --maxfail=1 --disable-warnings -q --junitxml=test-reports/pytest.xml
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

# -------------------------------
# 2) BUILD - tiny (emit tags)
# -------------------------------
build:
  stage: build
  image: alpine:3.18
  script:
    - echo "API_TAG=api" > deploy.env
    - echo "DAGSTER_TAG=dagster" >> deploy.env
    - cat deploy.env
  artifacts:
    paths:
      - deploy.env
    expire_in: 1 day

# -------------------------------
# 3) DEPLOY - SIMPLE, NO PULL / NO BUILD
#    starts containers only if images are already present on the runner
# -------------------------------
deploy:
  stage: deploy
  image: docker:24.0.2
  services:
    - docker:dind
  when: manual
  script:
    - echo "Deploy: starting core services only (realtime skipped)"
    - docker-compose -f docker-compose.yml up -d --no-build dagster api mlflow minio influxdb labelstudio grafana
    - docker-compose -f docker-compose.yml ps
