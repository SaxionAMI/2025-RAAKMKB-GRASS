stages:
  - test
  - build
  - deploy

variables:
  DAGSTER_HOME: "/app/dagster_home"
  PYTHON_VERSION: "3.10"
  DOCKER_REPO: "feyalt/grass-pipeline"

test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - mkdir -p test-reports
    - python -m pytest tests/ --maxfail=1 --disable-warnings -q --junitxml=test-reports/pytest.xml
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

build:
  stage: build
  image: alpine:3.18
  script:
    - echo "API_TAG=api" > deploy.env
    - echo "DAGSTER_TAG=dagster" >> deploy.env
    - cat deploy.env
  artifacts:
    paths:
      - deploy.env
    expire_in: 1 day

deploy:
  stage: deploy
  image: docker:24.0.2
  services:
    - docker:dind
  when: manual
  dependencies:
    - build
  before_script:
    # login if credentials provided (optional)
    - '[ -n "$DOCKER_HUB_USERNAME" ] && echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin || true'
    - export $(cat deploy.env | xargs) || true
  script:
    - |
      set +e
      rm -f /tmp/deploy.log || true
      echo "Pulling ${DOCKER_REPO}:${API_TAG} ..."
      docker pull "${DOCKER_REPO}:${API_TAG}" 2>&1 | tee -a /tmp/deploy.log
      echo "Pulling ${DOCKER_REPO}:${DAGSTER_TAG} ..."
      docker pull "${DOCKER_REPO}:${DAGSTER_TAG}" 2>&1 | tee -a /tmp/deploy.log
      echo "docker-compose pull ..."
      docker-compose -f docker-compose.yml pull 2>&1 | tee -a /tmp/deploy.log
      echo "docker-compose up -d ..."
      docker-compose -f docker-compose.yml up -d 2>&1 | tee -a /tmp/deploy.log
      echo "docker-compose ps ..."
      docker-compose -f docker-compose.yml ps 2>&1 | tee -a /tmp/deploy.log || true

      if grep -Ei "no space left on device|failed to register layer|write .* no space left" /tmp/deploy.log >/dev/null 2>&1; then
        echo ""
        echo "⚠️  Disk/extraction error detected (likely runner out of disk)."
        echo "Run these commands on a machine you control (laptop / VM / self-hosted runner):"
        echo ""
        echo "  docker pull ${DOCKER_REPO}:${API_TAG}"
        echo "  docker pull ${DOCKER_REPO}:${DAGSTER_TAG}"
        echo ""
        echo "  API_TAG=${API_TAG} DAGSTER_TAG=${DAGSTER_TAG} docker-compose -f docker-compose.yml pull"
        echo "  API_TAG=${API_TAG} DAGSTER_TAG=${DAGSTER_TAG} docker-compose -f docker-compose.yml up -d"
        echo ""
        exit 0
      fi

      # if any command failed (non-disk), return non-zero so the job fails
      LAST_RC=${PIPESTATUS[0]}
      if [ "$LAST_RC" -ne 0 ]; then
        echo "ERROR: deploy failed (see /tmp/deploy.log)"
        tail -n 200 /tmp/deploy.log || true
        exit $LAST_RC
      fi

      echo "Deploy completed."
