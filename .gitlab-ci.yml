stages:
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.10"
  DOCKER_REPO: "feyalt/grass-pipeline"

# 1) TEST - run unit tests (fast)
test:
  stage: test
  image: python:${PYTHON_VERSION}
  before_script:
    - export PYTHONPATH="$CI_PROJECT_DIR/grass_pipeline_dagster"
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r grass_pipeline_dagster/requirements.dagster.txt
    - python -m pip install pytest pytest-mock
    - mkdir -p test-reports
    - python -m pytest tests/ --maxfail=1 --disable-warnings -q --junitxml=test-reports/pytest.xml
  artifacts:
    when: always
    paths:
      - test-reports/
    reports:
      junit: test-reports/pytest.xml

# 2) BUILD
build:
  stage: build
  image: alpine:3.18
  script:
    - echo "API_TAG=api" > deploy.env
    - echo "DAGSTER_TAG=dagster" >> deploy.env
    - cat deploy.env
  artifacts:
    paths:
      - deploy.env
    expire_in: 1 day

# 3) DEPLOY - NO DOCKER on runner (prints exact local commands)
# This will NOT attempt docker pull/extract on the shared runner bcz we don't have enough space for it in our Gitlab atm:)
deploy:
  stage: deploy
  image: alpine:3.18
  when: manual
  dependencies:
    - build
  before_script:
    - export $(cat deploy.env | xargs) || true
  script:
    - echo "Runner will NOT pull or extract images. Use these commands on a machine you control (your laptop / self-hosted runner)."
    - echo ""
    - echo "1) (optional) fetch images from Hub locally:"
    - echo "   docker pull ${DOCKER_REPO}:api"
    - echo "   docker pull ${DOCKER_REPO}:dagster"
    - echo ""
    - echo "2) Start the stack locally (uses the images above):"
    - echo "   API_TAG=${API_TAG:-api} DAGSTER_TAG=${DAGSTER_TAG:-dagster} docker-compose -f docker-compose.yml pull"
    - echo "   API_TAG=${API_TAG:-api} DAGSTER_TAG=${DAGSTER_TAG:-dagster} docker-compose -f docker-compose.yml up -d"
    - echo ""
    - echo "3) (optional) quick healthcheck:"
    - echo "   sleep 6 && docker-compose -f docker-compose.yml exec -T api sh -c 'curl -fsS http://localhost:8000/health || (echo \"API health failed\" && exit 1)'"
    - echo ""
    - echo "If you need CI to do the pull/start, run CI on a self-hosted runner with plenty of disk (or preload images onto the runner using docker load)."
