# GPU overlay: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  dagster:
    environment: [DEVICE=cuda]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
  inference:
    environment: [DEVICE=cuda]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
