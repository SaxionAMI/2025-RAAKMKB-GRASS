# Global WebRTC settings
webrtc: yes              # enable WebRTC server
webrtcAddress: :8889     # HTTP/WebRTC signaling port
webrtcEncryption: no     # disable DTLS (optional)
webrtcAllowOrigins:
  - "*"                  # allow all origins
webrtcLocalUDPAddress: :8189  # UDP port for WebRTC ICE
webrtcTrustedProxies: []      # optional

# Paths / RTSP sources
paths:
  stream: {}
