# Football stadium sentiment (GRASS): the full stack.
#
#   minio      object storage for models and artifacts      :9000, console :9001
#   influxdb   sentiment time series                        :8086
#   grafana    dashboards                                    :3001
#   mediamtx   RTSP/WebRTC media server for live streams     :8554, API :9997
#   dagster    training and batch inference UI               :3000
#   inference  live sentiment per stream (SSE + InfluxDB)    :8000
#
# dagster and inference share one image (grass/app:local), built once:
#   docker compose build && docker compose up -d
# GPU:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Settings inside the containers point at the other services by name. They are
# set below and override .env, so the same .env also works for local runs.

x-app-env: &app-env
  AUDIO_OPS_TASKS_DIR: /app/tasks
  AUDIO_OPS_DISABLE_BUILTIN_TASKS: "true"
  STORAGE_BACKEND: minio
  MINIO_ENDPOINT: http://minio:9000
  ENABLE_INFLUXDB: "true"
  INFLUXDB_URL: http://influxdb:8086
  MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlflow.db

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [grass]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${MINIO_BUCKET_NAME:-audioops-bucket} || true &&
      echo 'bucket ready';"
    networks: [grass]

  influxdb:
    image: influxdb:2.7
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-adminpassword}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-audioops}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-audio_metrics}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-dev-token-change-me}
    ports: ["8086:8086"]
    volumes: ["influxdb_data:/var/lib/influxdb2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [grass]

  grafana:
    image: grafana/grafana:latest
    depends_on:
      influxdb: { condition: service_healthy }
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=dark
      - INFLUXDB_ORG=${INFLUXDB_ORG:-audioops}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-audio_metrics}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-dev-token-change-me}
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    ports: ["3001:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks: [grass]

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"     # RTSP
      - "8889:8889"     # WebRTC
      - "8888:8888"     # HLS
      - "9997:9997"     # API (the inference service polls it for new streams)
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    networks: [grass]

  dagster:
    image: grass/app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        FRAMEWORK_REF: "${FRAMEWORK_REF:-v1.2.0}"
        TORCH_INDEX: "${TORCH_INDEX:-}"
    command: ["dagster", "dev", "-m", "audio_ops_dagster.definitions", "-h", "0.0.0.0", "-p", "3000"]
    ports: ["3000:3000"]
    env_file: [.env]
    environment:
      <<: *app-env
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - ./tasks:/app/tasks
      - ./audio_input:/app/audio_input
      - ./storage:/app/storage
      - ./dagster_home:/app/dagster_home
      - ./mlruns:/app/mlruns
    depends_on:
      minio: { condition: service_healthy }
      influxdb: { condition: service_healthy }
    networks: [grass]

  inference:
    image: grass/app:local
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        FRAMEWORK_REF: "${FRAMEWORK_REF:-v1.2.0}"
        TORCH_INDEX: "${TORCH_INDEX:-}"
    command: ["audio-ops", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      <<: *app-env
      # Register every stream published to MediaMTX (stream1, stream2, ...).
      STREAM_AUTODISCOVER: "true"
      MEDIAMTX_API_URL: http://mediamtx:9997
      RTSP_BASE_URL: rtsp://mediamtx:8554
    volumes:
      - ./tasks:/app/tasks
      - ./storage:/app/storage
    depends_on:
      influxdb: { condition: service_healthy }
      mediamtx: { condition: service_started }
    networks: [grass]

networks:
  grass:
    driver: bridge

volumes:
  minio_data:
  influxdb_data:
  grafana_data: