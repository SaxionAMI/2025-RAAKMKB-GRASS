

services:
  dagster:
    build:
      context: .
      dockerfile: ./grass_pipeline_dagster/Dockerfile.dagster
    extra_hosts:
      - "minio:172.19.0.2"
    ports:
      - "3000:3000"
    environment:
      - DAGSTER_HOME=/app/dagster_home
    working_dir: /app
    volumes:
      - .:/app
      - ./dagster_home:/app/dagster_home
      - ./mlflow:/mlflow
      - ./mlflow/artifacts:/app/mlartifacts
      - ./label_studio_data:/label-studio/data
      - ./dagster_output:/app/dagster_output
      - cpp_ext:/app/cpp_processing
      - stream_data:/data/stream_segments
    command: ["dagster", "dev", "-h", "0.0.0.0", "-p", "3000", "-f", "grass_pipeline_dagster/grass_pipeline_dagster/definitions.py"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - BACKEND_STORE_URI=sqlite:///mlflow/mlflow.db
      - ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./mlflow:/mlflow
      - ./mlflow/artifacts:/mlflow/artifacts
    command: >
      mlflow server
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
        --host 0.0.0.0

  minio_grass:
    image: minio/minio:latest
    container_name: minio_grass
    hostname: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO UI
    volumes:
      - ./minio_storage:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=grass
      - DOCKER_INFLUXDB_INIT_BUCKET=predictions
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./dagster_home:/app/dagster_home
      - ./dagster_output:/app/dagster_output
      - ./config:/app/config
      - ./grass_pipeline_dagster:/app/grass_pipeline_dagster
      - ./api:/app/api
      - ./label_studio_data:/label-studio/data
      - stream_data:/data/stream_segments
      - ./demo_audio:/app/demo_audio
    environment:
      - PYTHONPATH=/app:/app/grass_pipeline_dagster
      - DAGSTER_HOME=/app/dagster_home
    restart: unless-stopped
    command: ["uvicorn", "api.predict_api:app", "--host", "0.0.0.0", "--port", "8000"]

  labelstudio:
    image: heartexlabs/label-studio:latest
    container_name: labelstudio
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - ./label_studio_data:/label-studio/data
    environment:
      - ML_TIMEOUT_PREDICT=3600
      - ML_TIMEOUT_HEALTH=60
      - ML_TIMEOUT_TRAIN=7200
      - GUNICORN_CMD_ARGS=--timeout 36000 --graceful-timeout 36000 --workers 2
    restart: unless-stopped

  grafana: 
    image: grafana/grafana:10.3.3
    user: "0"
    container_name: grafana
    ports:
      - "33000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - influxdb

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"     # RTSP
      - "8888:8888"     # HTTP API / WebRTC signaling
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

volumes:
  cpp_ext: {}
  stream_data:





